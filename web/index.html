<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Asuka — FM Towns / PC-98</title>
<style>
  :root {
    --cell: clamp(46px, 9.5vmin, 70px);
    --pad-gap: 8px;
    --edge: rgba(255, 255, 255, 0.16);
    --key-bg: rgba(255, 255, 255, 0.09);
    --key-bg-on: rgba(255, 255, 255, 0.34);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }

  /* Centre the letterboxed 4:3 stage on a pure-black field. */
  body { display: grid; place-items: center; }

  #stage {
    position: relative;
    width: min(100vw, 133.3333vh);
    height: min(75vw, 100vh);
    background: #000;
    overflow: hidden;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    outline: none;
    touch-action: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* ---- Minimal loader ---- */
  #loader {
    position: absolute;
    inset: 0;
    z-index: 30;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: opacity .5s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #loader .brand {
    font-size: clamp(18px, 3.6vw, 30px);
    letter-spacing: .42em;
    text-transform: uppercase;
    padding-left: .42em;
  }
  #loader .brand b { color: #ff5d8f; }
  #loader .bar {
    width: min(360px, 72vw);
    height: 5px;
    border-radius: 999px;
    background: #191919;
    overflow: hidden;
  }
  #loader .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: #f2f2f2;
    transition: width .18s ease;
  }
  #loader .pct { font-size: 12px; color: #8a8a8a; letter-spacing: .1em; }
  #loader .status {
    font-size: 11px;
    color: #8a8a8a;
    min-height: 1.1em;
    max-width: 52ch;
    text-align: center;
    padding: 0 16px;
    word-break: break-word;
  }
  #loader .status.err { color: #ff5d8f; }
  #loader .retry {
    margin-top: 4px;
    background: #161616;
    color: #fff;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 18px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  #loader .retry:hover { border-color: #ff5d8f; }

  /* ---- Touch overlay ---- */
  #pad { position: fixed; inset: 0; z-index: 15; display: none; pointer-events: none; }
  #pad.show { display: block; }

  #pad .key {
    pointer-events: auto;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--key-bg);
    border: 1px solid var(--edge);
    border-radius: 14px;
    color: #fff;
    font: inherit;
    font-size: 15px;
    padding: 0;
    touch-action: none;
    backdrop-filter: blur(3px);
    transition: background .08s ease, transform .05s ease;
  }
  #pad .key.on { background: var(--key-bg-on); transform: scale(.94); }

  #pad .dpad {
    position: absolute;
    left: calc(16px + env(safe-area-inset-left));
    bottom: calc(16px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: repeat(3, var(--cell));
    grid-template-rows: repeat(3, var(--cell));
    gap: var(--pad-gap);
  }
  #pad .dpad .key { width: var(--cell); height: var(--cell); }
  #pad .dpad .up    { grid-area: 1 / 2; }
  #pad .dpad .left  { grid-area: 2 / 1; }
  #pad .dpad .right { grid-area: 2 / 3; }
  #pad .dpad .down  { grid-area: 3 / 2; }

  #pad .actions {
    position: absolute;
    right: calc(16px + env(safe-area-inset-right));
    bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 16px;
  }
  #pad .actions .key {
    width: calc(var(--cell) * 1.12);
    height: calc(var(--cell) * 1.12);
    border-radius: 50%;
    font-size: 16px;
    font-weight: 600;
  }
  #pad .actions .a { background: rgba(255, 93, 143, 0.20); }
  #pad .actions .a.on { background: rgba(255, 93, 143, 0.55); }

  #pad .start {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    height: calc(var(--cell) * 0.6);
    padding: 0 20px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: .18em;
  }
  #pad .start.on { transform: translateX(-50%) scale(.94); }

  /* ---- Snapshot bar: save / load state with a visual thumbnail ---- */
  #snapbar {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    border-radius: 12px;
    background: rgba(10, 10, 12, 0.42);
    border: 1px solid var(--edge);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: .82;
    transition: opacity .15s ease;
  }
  #snapbar:hover, #snapbar:focus-within { opacity: 1; }

  #snapbar button {
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; gap: 5px;
    padding: 7px 11px;
    border-radius: 9px;
    border: 1px solid var(--edge);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font: inherit;
    font-size: 12px;
    letter-spacing: .04em;
    cursor: pointer;
    transition: background .1s ease, transform .06s ease;
  }
  #snapbar button:hover { background: rgba(255, 255, 255, 0.18); }
  #snapbar button:active { transform: scale(.95); }

  /* The preview doubles as the LOAD target. */
  #snap-thumb {
    width: 64px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px;
    border: 1px solid var(--edge);
    background: rgba(0, 0, 0, 0.55) center / cover no-repeat;
    color: rgba(255, 255, 255, 0.45);
    font-size: 9px; letter-spacing: .08em;
    cursor: pointer;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .1s ease, transform .06s ease;
  }
  #snap-thumb.filled { border-color: rgba(255, 255, 255, 0.42); color: transparent; }
  #snap-thumb:active { transform: scale(.95); }

  /* Transient status toast. */
  #snap-toast {
    position: absolute;
    top: calc(60px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    z-index: 20;
    padding: 5px 10px;
    border-radius: 8px;
    background: rgba(10, 10, 12, 0.72);
    border: 1px solid var(--edge);
    color: #fff;
    font-size: 11px;
    letter-spacing: .04em;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  #snap-toast.show { opacity: 1; }

  @media (max-width: 420px) {
    #snapbar button .label { display: none; }
    #snap-thumb { width: 52px; height: 39px; }
  }

  /* ---- Input-mode toggle: Gamepad <-> PC-98 keyboard ---- */
  #modebtn {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    z-index: 21;
    display: none;
    align-items: center;
    gap: 6px;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--edge);
    background: rgba(10, 10, 12, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font: inherit;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background .12s ease, transform .06s ease;
  }
  #modebtn.show { display: flex; }
  #modebtn:active { transform: scale(.95); }
  #modebtn .glyph { opacity: .38; transition: opacity .12s ease; }
  #modebtn .glyph.active { opacity: 1; }
  #modebtn .swap { font-size: 12px; opacity: .5; }

  /* ---- Virtual PC-98 keyboard overlay ---- */
  #kbd {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 16;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 8px calc(6px + env(safe-area-inset-right))
             calc(8px + env(safe-area-inset-bottom))
             calc(6px + env(safe-area-inset-left));
    pointer-events: none;
  }
  #kbd.show { display: flex; }
  #kbd .row {
    display: flex;
    justify-content: center;
    gap: 5px;
    width: 100%;
    max-width: 760px;
  }
  #kbd .key {
    pointer-events: auto;
    flex: 1 1 0;
    min-width: 0;
    height: clamp(30px, 6.4vmin, 44px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 2px;
    border-radius: 7px;
    border: 1px solid var(--edge);
    background: var(--key-bg);
    color: #fff;
    font: inherit;
    font-size: clamp(10px, 2.4vmin, 13px);
    letter-spacing: .02em;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    transition: background .08s ease, transform .06s ease;
  }
  #kbd .key.on { background: var(--key-bg-on); transform: scale(.94); }
  #kbd .key.util {
    flex: 0 1 auto;
    padding: 0 8px;
    font-size: clamp(9px, 2.1vmin, 12px);
    background: rgba(255, 93, 143, 0.16);
  }
  #kbd .key.util.on { background: rgba(255, 93, 143, 0.5); }
  #kbd .key.wide { flex: 2.4 1 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" width="640" height="480" tabindex="0"></canvas>

  <div id="loader">

    <div class="pct" id="loader-pct">0%</div>

  <div id="snapbar" hidden>

<pre id="log" hidden></pre>

<script src="asuka_web.js"></script>
<script>
"use strict";

// Host key identifiers — must match enum class asuka::Key in
// include/asuka/Input.hpp (order matters). Keys are lowercase so they line up
// directly with the touch overlay's data-key attributes.
const KEY = {
  none: 0, up: 1, down: 2, left: 3, right: 4,
  start: 5, select: 6, a: 7, b: 8, x: 9, y: 10, l: 11, r: 12,
};

// PC-98 keyboard scancodes (make codes, 0x00-based), for the virtual keyboard
// overlay. These go straight to the engine's core-native input path
// (asuka_web_scancode), because asuka::Key cannot express HELP/STOP/ROLL/F-keys.
// Values follow the PC-98 hardware layout, not PC/AT.
const PC98_SC = {
  ESC: 0x00, TAB: 0x0f, ENTER: 0x1c, SPACE: 0x34,
  UP: 0x3a, LEFT: 0x3b, RIGHT: 0x3c, DOWN: 0x3d,
  ROLLUP: 0x36, ROLLDOWN: 0x37, HELP: 0x3f, STOP: 0x60,
  F1: 0x62, F2: 0x63, F3: 0x64, F4: 0x65, F5: 0x66,
};

const BIOS_DIR = "/bios";
const MEDIA_DIR = "/media";
const ASSET_BASE = "./assets";

const el = (id) => document.getElementById(id);
const logEl = el("log");
function log(msg, cls) {
  (cls === "err" ? console.error : console.log)("[asuka] " + msg);
  if (!logEl) return;
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

const state = { Module: null, running: false, booting: false, pc98: false, mode: "pad" };

// ---------------------------------------------------------------------------
// Input: a single funnel into the engine's C API.
//
// asuka_web_key(key, pressed) feeds the small asuka::Key set (gamepad buttons);
// asuka_web_scancode(sc, pressed) feeds a core-native PC-98 scancode, used by
// the virtual keyboard for keys asuka::Key cannot express. The engine's
// keyboard sink is idempotent, so the on-screen controls and a physical
// keyboard can both feed it without double events mattering. `pressed` tracks
// held keys so we can release everything on focus loss and never leave a
// button stuck down.
// ---------------------------------------------------------------------------
const pressed = new Set();

function sendInput(name, on) {
  if (!state.Module) return;
  const id = KEY[String(name).toLowerCase()];
  if (id === undefined) return;
  if (on) { if (pressed.has(name)) return; pressed.add(name); }
  else { if (!pressed.has(name)) return; pressed.delete(name); }
  state.Module.ccall("asuka_web_key", null, ["number", "number"], [id, on ? 1 : 0]);
}

// Feed a PC-98 scancode. `tag` identifies the source key (e.g. "kbd:HELP") so
// overlapping press/release pairs from touch and a physical keyboard dedupe
// like sendInput does. `heldSc` remembers the code for each tag so releaseAll
// can let go of keys even after their element is gone.
function sendScancode(tag, sc, on) {
  if (!state.Module) return;
  if (on) {
    if (heldSc.has(tag)) return;
    heldSc.set(tag, sc);
  } else {
    if (!heldSc.has(tag)) return;
    heldSc.delete(tag);
  }
  state.Module.ccall("asuka_web_scancode", null, ["number", "number"], [sc, on ? 1 : 0]);
}

function releaseAll() {
  for (const name of [...pressed]) sendInput(name, false);
  for (const [tag, sc] of [...heldSc]) sendScancode(tag, sc, false);
  document.querySelectorAll("#pad .key.on, #kbd .key.on")
    .forEach((b) => b.classList.remove("on"));
}

const heldSc = new Map();

function reset() {
  if (!state.Module) return;
  state.Module.ccall("asuka_web_reset", null, [], []);
  log("reset");
}

// ---------------------------------------------------------------------------
// Virtual filesystem helpers
// ---------------------------------------------------------------------------
function ensureDir(path) {
  const FS = state.Module.FS;
  try { FS.mkdir(path); } catch (e) {
    if (e && e.errno !== 20 /* EEXIST */) throw e;
  }
}

// Mount an IndexedDB-backed filesystem at the snapshot directory so saved
// states survive a page reload. Existing data is pulled in with syncfs(true).
// Mounting is best-effort: if IndexedDB is unavailable, snapshots still work
// for the current session (they just do not persist).
async function mountSnapshotFS() {
  const FS = state.Module.FS;
  // The IDBFS backend is exposed as Module.IDBFS (see EXPORTED_RUNTIME_METHODS
  // in CMakeLists.txt); FS.filesystems is not part of the exported runtime.
  const backend = state.Module.IDBFS;
  if (!backend) {
    log("snapshot persistence unavailable (no IDBFS backend)", "err");
    return;
  }
  const dir = BIOS_DIR + "/snapshots";
  ensureDir(BIOS_DIR);
  ensureDir(dir);
  try {
    FS.mount(backend, {}, dir);
  } catch (e) {
    if (e && e.errno !== 10 /* EBUSY: already mounted */) {
      log("snapshot mount failed: " + (e.message || e), "err");
      return;
    }
  }
  await new Promise((resolve) => FS.syncfs(true, () => resolve()));
  log("snapshot storage mounted at " + dir, "ok");
}

async function fetchToFS(url, dir, name, onBytes) {
  const res = await fetch(url, { cache: "force-cache" });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText} for ${url}`);
  const total = Number(res.headers.get("content-length")) || 0;
  const reader = res.body && res.body.getReader ? res.body.getReader() : null;
  let buf;
  if (reader) {
    const chunks = [];
    let received = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      if (onBytes) onBytes(value.length, total);
    }
    buf = new Uint8Array(received);
    let off = 0;
    for (const c of chunks) { buf.set(c, off); off += c.length; }
  } else {
    buf = new Uint8Array(await res.arrayBuffer());
    if (onBytes) onBytes(buf.length, total || buf.length);
  }
  ensureDir(dir);
  state.Module.FS.writeFile(`${dir}/${name}`, buf);
  return buf.length;
}

// ---------------------------------------------------------------------------
// Loader
// ---------------------------------------------------------------------------
function loaderSet(pct, status, isError) {
  if (typeof pct === "number" && isFinite(pct)) {
    el("loader-bar").style.width = Math.max(0, Math.min(100, pct)).toFixed(1) + "%";
    el("loader-pct").textContent = Math.round(pct) + "%";
  }
  if (status !== undefined) {
    const s = el("loader-status");
    s.textContent = status;
    s.classList.toggle("err", !!isError);
  }
}
function loaderDone() {
  const l = el("loader");
  l.classList.add("hidden");
  setTimeout(() => { l.style.display = "none"; }, 600);
}
function loaderFail(msg) {
  log("boot failed: " + msg, "err");
  loaderSet(100, msg, true);
  el("loader-retry").hidden = false;
}

// The service worker reloads the page once on a first (header-less) visit; wait
// briefly for isolation so the threaded build can start on the reloaded page.
function waitForIsolation(timeoutMs) {
  if (window.crossOriginIsolated) return Promise.resolve(true);
  return new Promise((resolve) => {
    const started = Date.now();
    const tick = () => {
      if (window.crossOriginIsolated) return resolve(true);
      if (Date.now() - started >= timeoutMs) return resolve(false);
      setTimeout(tick, 100);
    };
    tick();
  });
}

// ---------------------------------------------------------------------------
// Emscripten module lifecycle
// ---------------------------------------------------------------------------
async function loadModule() {
  if (state.Module) return state.Module;
  const factory = window.createAsukaModule;
  if (typeof factory !== "function") {
    throw new Error("asuka_web.js not loaded (missing createAsukaModule)");
  }
  const Module = await factory({
    canvas: el("canvas"),
    arguments: [],
    print: (s) => log(s),
    printErr: (s) => log(s, "err"),
  });
  state.Module = Module;
  // Debug handle for the console and the headless test harness.
  window.asuka = {
    module: Module,
    ccall: (n, r, a, v) => Module.ccall(n, r, a, v),
    sendInput,
    KEY,
    state,
  };
  log("runtime ready", "ok");
  return Module;
}

// ---------------------------------------------------------------------------
// Turnkey boot: load the bundled BIOS + disc from assets/manifest.json and
// start the engine with no user input.
// ---------------------------------------------------------------------------
async function autoBoot() {
  loaderSet(2, "Booting…");
  try {
    let manifest = null;
    try {
      const r = await fetch(`${ASSET_BASE}/manifest.json`, { cache: "no-store" });
      if (r.ok) manifest = await r.json();
    } catch (e) { /* no manifest */ }
    if (!manifest || !Array.isArray(manifest.bios) || !Array.isArray(manifest.media) ||
        (!manifest.bios.length && !manifest.media.length)) {
      throw new Error("No bundled assets found (assets/manifest.json missing).");
    }

    await waitForIsolation(6000);
    await loadModule();
    try { await mountSnapshotFS(); } catch (e) { log("snapshot FS init failed: " + e, "err"); }

    // Prefer the manifest's exact byte sizes: some hosts report a compressed
    // content-length on HEAD that does not match the decoded body we stream.
    const all = [...manifest.bios, ...manifest.media];
    let totalBytes = manifest.totalBytes || all.reduce((a, e) => a + (e.size || 0), 0);
    if (!totalBytes) {
      try {
        const head = await Promise.all(all.map(async (e) =>
          Number((await fetch(`${ASSET_BASE}/${e.url}`, { method: "HEAD" }))
            .headers.get("content-length")) || 0));
        totalBytes = head.reduce((a, b) => a + b, 0);
      } catch (e) { totalBytes = 0; }
    }

    let loaded = 0;
    const bump = (n) => {
      loaded += n;
      const pct = totalBytes ? 4 + 90 * (loaded / totalBytes) : 50;
      loaderSet(pct, `Loading ${(loaded / 1048576).toFixed(1)} / ${(totalBytes / 1048576).toFixed(1)} MB`);
    };

    loaderSet(4, "Loading BIOS & disc…");
    for (const e of manifest.bios) await fetchToFS(`${ASSET_BASE}/${e.url}`, BIOS_DIR, e.name, bump);
    for (const e of manifest.media) await fetchToFS(`${ASSET_BASE}/${e.url}`, MEDIA_DIR, e.name, bump);
    log(`auto-loaded ${manifest.bios.length} BIOS file(s), ${manifest.media.length} media file(s)`);

    loaderSet(96, "Warming up the machine…");
    // The media entry is optional: PC-98 boots from its built-in BIOS I/O
    // emulation with no disc at all, whereas FM Towns needs a disc. The
    // manifest names the disc with "cue" (a CUE/BIN or ISO set) or "media".
    const mediaName = manifest.cue || manifest.media;
    const mediaPath = mediaName ? `${MEDIA_DIR}/${mediaName}` : "";
    // The machine comes from ?machine= (so a PC-98 set can be booted without
    // editing the manifest) or the manifest's "machine" field; FM Towns is the
    // default so existing deployments keep working.
    const wanted = new URLSearchParams(location.search).get("machine") ||
                   manifest.machine || "fmtowns";
    const ok = state.Module.ccall("asuka_web_init", "number",
                                  ["string", "string", "string"],
                                  [BIOS_DIR, mediaPath, wanted]);
    if (!ok) {
      const err = state.Module.UTF8ToString(
        state.Module.ccall("asuka_web_last_error", "number", [], []));
      throw new Error(err || "engine init failed");
    }
    state.pc98 = state.Module.ccall("asuka_web_is_pc98", "number", [], []) !== 0;
    state.Module.ccall("asuka_web_start", null, ["number"], [0]);
    state.running = true;

    loaderSet(100, "Running");
    loaderDone();
    el("canvas").focus();
    // The input-mode switch is useful on touch devices (no keyboard) and on
    // PC-98 generally (the overlay carries the machine's utility keys).
    if (isTouchDevice() || state.pc98) {
      el("modebtn").classList.add("show");
      setInputMode("pad");
    }
    el("snapbar").hidden = false;
    // Show any thumbnail restored from IndexedDB on a previous visit.
    refreshThumbnail();
    log(`running (auto-boot, ${state.pc98 ? "pc98" : "fmtowns"})`, "ok");
    return true;
  } catch (e) {
    loaderFail(e && e.message ? e.message : String(e));
    return false;
  }
}

// ---------------------------------------------------------------------------
// Input wiring
// ---------------------------------------------------------------------------
function isTouchDevice() {
  return (navigator.maxTouchPoints > 0) || ("ontouchstart" in window) ||
         (window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
}

const SCAN_TO_KEY = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  Enter: "start", NumpadEnter: "start", Backspace: "select",
  Space: "a", KeyZ: "b", KeyX: "x", KeyC: "y",
};

// Physical-keyboard -> PC-98 scancode map. Used when the machine is a PC-98:
// typing goes to the emulated keyboard, while the arrow keys still double as
// the gamepad d-pad (via SCAN_TO_KEY) so pad-driven games stay playable.
const PHYS_TO_PC98 = {
  Escape: PC98_SC.ESC, Tab: PC98_SC.TAB,
  Enter: PC98_SC.ENTER, NumpadEnter: PC98_SC.ENTER,
  Space: PC98_SC.SPACE, Backspace: 0x0e,
  ArrowUp: PC98_SC.UP, ArrowDown: PC98_SC.DOWN,
  ArrowLeft: PC98_SC.LEFT, ArrowRight: PC98_SC.RIGHT,
  Home: PC98_SC.HELP, Insert: PC98_SC.ROLLUP, Delete: PC98_SC.ROLLDOWN,
  F1: PC98_SC.F1, F2: PC98_SC.F2, F3: PC98_SC.F3,
  F4: PC98_SC.F4, F5: PC98_SC.F5,
  Digit1: 0x01, Digit2: 0x02, Digit3: 0x03, Digit4: 0x04, Digit5: 0x05,
  Digit6: 0x06, Digit7: 0x07, Digit8: 0x08, Digit9: 0x09, Digit0: 0x0a,
  KeyQ: 0x10, KeyW: 0x11, KeyE: 0x12, KeyR: 0x13, KeyT: 0x14,
  KeyY: 0x15, KeyU: 0x16, KeyI: 0x17, KeyO: 0x18, KeyP: 0x19,
  KeyA: 0x1d, KeyS: 0x1e, KeyD: 0x1f, KeyF: 0x20, KeyG: 0x21,
  KeyH: 0x22, KeyJ: 0x23, KeyK: 0x24, KeyL: 0x25,
  KeyZ: 0x29, KeyX: 0x2a, KeyC: 0x2b, KeyV: 0x2c, KeyB: 0x2d,
  KeyN: 0x2e, KeyM: 0x2f,
};

function onKey(e, on) {
  if (on && e.code === "F11") { toggleFullscreen(); e.preventDefault(); return; }
  if (on && e.code === "F2" && !state.pc98) { saveSnapshot(); e.preventDefault(); return; }
  if (on && e.code === "F4" && !state.pc98) { loadSnapshot(); e.preventDefault(); return; }
  if (on && e.code === "KeyR" && !e.ctrlKey && !e.metaKey) { reset(); e.preventDefault(); return; }

  if (state.pc98) {
    const sc = PHYS_TO_PC98[e.code];
    if (sc !== undefined) {
      if (!e.repeat || !on) sendScancode("phys:" + e.code, sc, on);
      e.preventDefault();
    }
  }
  // Arrow keys keep driving the gamepad d-pad (the PC-98 overlay has its own
  // arrow keys for the emulated keyboard).
  const name = SCAN_TO_KEY[e.code];
  if (name) { if (!e.repeat || !on) sendInput(name, on); e.preventDefault(); }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    const stage = el("stage");
    (stage.requestFullscreen || stage.webkitRequestFullscreen || (() => {})).call(stage);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
  }
}

// The two on-screen control surfaces: the gamepad pad (#pad) and the virtual
// PC-98 keyboard (#kbd). Only one is visible at a time; the floating #modebtn
// swaps between them. Held keys are released on every switch so nothing sticks.
function setInputMode(mode) {
  state.mode = mode === "kbd" ? "kbd" : "pad";
  releaseAll();
  el("pad").classList.toggle("show", state.mode === "pad");
  el("kbd").classList.toggle("show", state.mode === "kbd");
  document.querySelectorAll("#modebtn .glyph").forEach((g) => {
    g.classList.toggle("active", g.dataset.mode === state.mode);
  });
}

function wireModeButton() {
  el("modebtn").addEventListener("click", (e) => {
    e.preventDefault();
    setInputMode(state.mode === "pad" ? "kbd" : "pad");
  });
  el("modebtn").addEventListener("contextmenu", (e) => e.preventDefault());
}

// Bind a button element to a press/release handler pair, with pointer capture
// so a finger sliding off the key still releases it.
function bindHold(btn, down, up) {
  const onDown = (e) => {
    e.preventDefault();
    e.stopPropagation();
    try { btn.setPointerCapture(e.pointerId); } catch (_) { /* not critical */ }
    btn.classList.add("on");
    down();
  };
  const onUp = (e) => {
    e.preventDefault();
    btn.classList.remove("on");
    up();
  };
  btn.addEventListener("pointerdown", onDown);
  btn.addEventListener("pointerup", onUp);
  btn.addEventListener("pointercancel", onUp);
  btn.addEventListener("lostpointercapture", onUp);
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
}

function wirePad() {
  document.querySelectorAll("#pad .key").forEach((btn) => {
    const name = btn.dataset.key;
    bindHold(btn, () => sendInput(name, true), () => sendInput(name, false));
  });
}

function wireKeyboard() {
  document.querySelectorAll("#kbd .key").forEach((btn) => {
    const sc = Number(btn.dataset.sc);
    const tag = "kbd:" + btn.textContent.trim().replace(/\s+/g, "");
    bindHold(btn, () => sendScancode(tag, sc, true),
                   () => sendScancode(tag, sc, false));
  });
}

// ---------------------------------------------------------------------------
// Visual snapshots: save/load slot 1 with a thumbnail preview.
//
// The engine writes /bios/snapshots/slotN.state plus a BMP thumbnail beside
// it. The thumbnail is turned into a blob URL for the preview; FS.syncfs()
// flushes both to IndexedDB so they survive a reload.
// ---------------------------------------------------------------------------
const SNAP_SLOT = 1;
let thumbUrl = null;

function snapToast(msg) {
  const t = el("snap-toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(snapToast._timer);
  snapToast._timer = setTimeout(() => t.classList.remove("show"), 1400);
}

// Read the slot's thumbnail BMP from the virtual FS and show it as the
// preview background. Clears the preview when no thumbnail exists.
function refreshThumbnail() {
  const thumb = el("snap-thumb");
  if (!state.Module) return;
  const heap = state.Module.HEAPU8;
  if (!heap) return;  // heap view not exported; skip the preview
  const ptr = state.Module.ccall("asuka_web_get_snapshot_thumbnail", "number",
                                 ["number"], [SNAP_SLOT]);
  const size = state.Module.ccall("asuka_web_snapshot_thumbnail_size", "number",
                                  [], []);

  if (!ptr || size <= 0) {
    thumb.classList.remove("filled");
    thumb.style.backgroundImage = "";
    thumb.textContent = "SLOT " + SNAP_SLOT;
    log("slot " + SNAP_SLOT + ": no thumbnail", "err");
    return;
  }

  const bytes = new Uint8Array(heap.buffer, ptr, size).slice();
  const blob = new Blob([bytes], { type: "image/bmp" });
  if (thumbUrl) URL.revokeObjectURL(thumbUrl);
  thumbUrl = URL.createObjectURL(blob);
  thumb.style.backgroundImage = `url(${thumbUrl})`;
  thumb.classList.add("filled");
  log("slot " + SNAP_SLOT + ": thumbnail " + size + " bytes", "ok");
}

function persistFS() {
  // Flush the in-memory FS to IndexedDB so snapshots survive a refresh.
  if (state.Module && state.Module.FS && state.Module.FS.syncfs) {
    state.Module.FS.syncfs(false, (err) => {
      if (err) log("snapshot persist failed: " + err, "err");
    });
  }
}

function saveSnapshot() {
  if (!state.Module) return;
  const ok = state.Module.ccall("asuka_web_save_snapshot", "number",
                                ["number"], [SNAP_SLOT]);
  if (!ok) {
    snapToast("snapshot failed");
    log("save_snapshot failed", "err");
    return;
  }
  refreshThumbnail();
  persistFS();
  snapToast("saved");
  log("snapshot saved to slot " + SNAP_SLOT, "ok");
}

function loadSnapshot() {
  if (!state.Module) return;
  if (!state.Module.ccall("asuka_web_has_snapshot", "number",
                          ["number"], [SNAP_SLOT])) {
    snapToast("no snapshot");
    return;
  }
  const ok = state.Module.ccall("asuka_web_load_snapshot", "number",
                                ["number"], [SNAP_SLOT]);
  snapToast(ok ? "loaded" : "load failed");
  log(ok ? "snapshot loaded from slot " + SNAP_SLOT : "load_snapshot failed",
      ok ? "ok" : "err");
}

function wireSnapshots() {
  el("snap-save").addEventListener("click", (e) => { e.stopPropagation(); saveSnapshot(); });
  el("snap-load").addEventListener("click", (e) => { e.stopPropagation(); loadSnapshot(); });
  // Tapping the preview loads too, mirroring the LOAD button.
  el("snap-thumb").addEventListener("click", (e) => { e.stopPropagation(); loadSnapshot(); });
}

// ---------------------------------------------------------------------------
// Boot the page.
// ---------------------------------------------------------------------------
window.addEventListener("DOMContentLoaded", () => {
  wirePad();
  wireKeyboard();
  wireModeButton();
  wireSnapshots();

  // Physical keyboard: listen on the window so it works whatever has focus,
  // and keep the canvas focused so the SDL2 listener sees the events too.
  window.addEventListener("keydown", (e) => onKey(e, true));
  window.addEventListener("keyup", (e) => onKey(e, false));
  window.addEventListener("blur", releaseAll);
  document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

  // Tapping the game view restores keyboard focus.
  el("stage").addEventListener("pointerdown", () => el("canvas").focus());

  el("canvas").focus();
  el("loader-retry").onclick = () => location.reload();
  log("Asuka web shell ready");
  if (!window.crossOriginIsolated) {
    log("warning: not cross-origin isolated — threads need COOP/COEP.", "err");
  }
  autoBoot();
});
</script>
</body>
</html>
